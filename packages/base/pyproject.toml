[project]
name = "concord-base"
version = "0.1.0"
description = "Concord base science library"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ian Ross", email = "iross@mit.edu" }
]
dependencies = [
    "appdirs>=1.4.4",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyproj>=3.8.0",
    "pyresample>=1.35.0",
    "rasterio>=1.5.2",
    "s3fs>=2026.9.0",
    "scikit-image>=0.26.0",
    "segmentation-models-pytorch>=0.6.0",
    "shapely>=2.2.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "xarray>=2026.9.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "concord"
namespace = true
