[project]
name = "concord-services"
version = "0.1.0"
description = "Concord external services library"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ian Ross", email = "iross@mit.edu" }
]
dependencies = [
    "httpx>=0.28.1",
    "httpx-retries>=0.6.0",
    "pyarrow>=26.0.1",
    "pyorbital>=1.14.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "concord"
namespace = true

