[project]
name = "concord-storage-api"
version = "0.1.0"
description = "Concord API-based storage library"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ian Ross", email = "iross@mit.edu" }
]
dependencies = [
    "concord-storage-common",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "concord"
namespace = true

[tool.uv.sources]
concord-storage-common = { workspace = true }

