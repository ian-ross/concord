[project]
name = "concord-root"
version = "0.1.0"
description = "Concord contrail timeline system"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ian Ross", email = "iross@mit.edu" }
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
exclude = ["apps/web", "apps/slurm-manager"]


