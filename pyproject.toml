[project]
name = "concord-root"
version = "0.1.0"
description = "Concord contrail timeline system"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ian Ross", email = "iross@mit.edu" }
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
exclude = ["apps/web", "apps/slurm-manager"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
concord-api = { workspace = true }
concord-base = { workspace = true }
concord-workflows = { workspace = true }
concord-services = { workspace = true }
concord-storage-common = { workspace = true }
concord-storage-api = { workspace = true }
concord-storage-local = { workspace = true }
concord-toolkit = { workspace = true }

