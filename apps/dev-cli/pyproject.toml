[project]
name = "concord-dev-cli"
version = "0.1.0"
description = "Concord development CLI"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ian Ross", email = "iross@mit.edu" }
]
dependencies = [
    "click>=8.5.1",
    "concord-api",
    "concord-base",
    "concord-storage-local",
]

[project.scripts]
dev-cli = "concord.dev_cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "concord"
namespace = true

[tool.uv.sources]
concord-api = { workspace = true }
concord-base = { workspace = true }
concord-storage-local = { workspace = true }
